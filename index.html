<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel Electricity Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --success: #059669;
    --danger: #dc2626;
    --warn: #d97706;
    --m1: #2563eb;
    --m2: #059669;
    --m3: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { font-size: 13px; color: var(--muted); }
  header .right { display: flex; align-items: center; gap: 10px; }
  #status {
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 12px;
    background: #eef2ff;
    color: var(--primary-dark);
  }
  #status.error { background: #fee2e2; color: var(--danger); }
  #status.ok { background: #d1fae5; color: var(--success); }
  #status.warn { background: #fef3c7; color: var(--warn); }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
  }
  .icon-btn:hover { background: #f3f4f6; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card h2 {
    margin: 0 0 14px 0;
    font-size: 15px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .meter-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    background: #fafbfc;
  }
  .meter-card .meter-name {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meter-card .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .meter-card .stats {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .meter-card .big { font-size: 22px; font-weight: 600; }
  .meter-card .small { font-size: 12px; color: var(--muted); }
  .meter-card .change { font-size: 12px; margin-top: 4px; }
  .change.up { color: var(--danger); }
  .change.down { color: var(--success); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }
  .controls label {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  select, input[type="text"], input[type="number"], input[type="date"], input[type="month"] {
    font: inherit;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  form.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  form.grid label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  form.grid label.full { grid-column: 1 / -1; }
  button {
    font: inherit;
    padding: 9px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    font-weight: 500;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary { background: #e5e7eb; color: var(--text); }
  button.secondary:hover { background: #d1d5db; }
  button.danger {
    background: transparent; color: var(--danger);
    padding: 4px 6px; font-size: 12px;
  }
  button.danger:hover { background: #fee2e2; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td {
    padding: 9px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
  }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .chart-wrap { position: relative; height: 320px; }
  .meter-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
  }
  .pill-1 { background: var(--m1); }
  .pill-2 { background: var(--m2); }
  .pill-3 { background: var(--m3); }

  /* Drop zone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    background: #fafbfc;
    margin-bottom: 16px;
  }
  .dropzone:hover, .dropzone.dragging {
    border-color: var(--primary);
    background: #eef4ff;
    color: var(--primary-dark);
  }
  .dropzone strong { color: var(--text); }
  .dropzone input[type="file"] { display: none; }
  .extracted {
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #065f46;
  }
  .extracted.dup {
    background: #fef3c7;
    border-color: #fcd34d;
    color: #92400e;
  }
  .extracted.err {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #991b1b;
  }
  .chip {
    display: inline-block;
    background: #fff;
    border: 1px solid #d1fae5;
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-variant-numeric: tabular-nums;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    padding: 22px;
    max-width: 480px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
  }
  .modal h3 { margin: 0 0 4px 0; }
  .modal p { color: var(--muted); margin: 0 0 16px 0; font-size: 14px; }
  .modal .row {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .modal .row label { font-size: 13px; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  @media (max-width: 600px) {
    main { padding: 12px; }
    header { padding: 12px 16px; }
    th, td { padding: 7px 6px; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Hotel Empereal — Electricity Tracker</h1>
    <div class="sub">Monthly consumption across 3 meters</div>
  </div>
  <div class="right">
    <button class="icon-btn" id="open-settings" title="Settings">⚙ Settings</button>
    <div id="status">Loading…</div>
  </div>
</header>

<main>
  <!-- Summary -->
  <section class="card">
    <h2>Latest month</h2>
    <div id="summary" class="summary-grid"></div>
  </section>

  <!-- Chart -->
  <section class="card">
    <h2>Trend</h2>
    <div class="controls">
      <label>Meter
        <select id="chart-meter">
          <option value="all">All meters</option>
          <option value="1">Meter 1</option>
          <option value="2">Meter 2</option>
          <option value="3">Meter 3</option>
        </select>
      </label>
      <label>Metric
        <select id="chart-metric">
          <option value="units">Units (kWh)</option>
          <option value="cost">Cost (Rs.)</option>
        </select>
      </label>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </section>

  <!-- Add bill -->
  <section class="card">
    <h2>Add bill</h2>

    <!-- PDF drop zone -->
    <label class="dropzone" id="dropzone">
      <input type="file" id="pdf-input" accept="application/pdf" />
      <div><strong>📄 Drop a CEB bill PDF here</strong> or click to choose</div>
      <div style="font-size:12px;margin-top:6px">Auto-fills the form below. Same bill can't be added twice.</div>
    </label>
    <div id="extracted-msg"></div>

    <form id="add-form" class="grid">
      <input type="hidden" name="billRef" />
      <label>Meter
        <select name="meter" required>
          <option value="1">Meter 1</option>
          <option value="2">Meter 2</option>
          <option value="3">Meter 3</option>
        </select>
      </label>
      <label>Bill month
        <input type="month" name="month" required />
      </label>
      <label>Previous reading (kWh)
        <input type="number" name="prevReading" step="any" required />
      </label>
      <label>Current reading (kWh)
        <input type="number" name="currReading" step="any" required />
      </label>
      <label>Units consumed
        <input type="text" name="units" readonly placeholder="auto" />
      </label>
      <label>Total amount (Rs.)
        <input type="number" name="totalRs" step="0.01" required />
      </label>
      <label class="full">Notes (optional)
        <input type="text" name="notes" placeholder="e.g. main building, kitchen, rooms…" />
      </label>
      <div class="full" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button type="submit" id="save-btn">Save bill</button>
        <button type="button" class="secondary" id="sample-btn">Fill from sample (Apr 2026)</button>
        <button type="button" class="secondary" id="clear-btn">Clear</button>
      </div>
    </form>
  </section>

  <!-- Table -->
  <section class="card">
    <h2>All bills</h2>
    <div class="controls">
      <label>Filter by meter
        <select id="table-meter">
          <option value="all">All meters</option>
          <option value="1">Meter 1</option>
          <option value="2">Meter 2</option>
          <option value="3">Meter 3</option>
        </select>
      </label>
    </div>
    <div id="table-wrap"></div>
  </section>
</main>

<!-- Settings modal -->
<div class="modal-backdrop" id="settings-modal">
  <div class="modal">
    <h3>Meter ⇄ Account mapping</h3>
    <p>Tell the app which CEB account number belongs to which meter, so uploaded bills land in the right meter automatically.</p>
    <div class="row"><label>Meter 1</label><input id="acct-1" placeholder="e.g. 3718226707" /></div>
    <div class="row"><label>Meter 2</label><input id="acct-2" placeholder="account no." /></div>
    <div class="row"><label>Meter 3</label><input id="acct-3" placeholder="account no." /></div>
    <p style="font-size:12px;margin-top:14px">Saved in this browser only.</p>
    <div class="modal-actions">
      <button type="button" class="secondary" id="settings-cancel">Cancel</button>
      <button type="button" id="settings-save">Save</button>
    </div>
  </div>
</div>

<script>
// =============================================================
//  CONFIG — paste your Google Apps Script Web App URL here.
//  See SETUP.md for instructions on how to get this URL.
//  Leave it on "" to run in DEMO mode (data stored in browser).
// =============================================================
const SCRIPT_URL = "";

const DEMO_KEY = "hotel-electricity-demo";
const METER_MAP_KEY = "hotel-electricity-meter-map";

const DEMO_SEED = [
  { id:"d1", meter:1, month:"2026-04", prevReading:16514, currReading:19768, units:3254, totalRs:121565.13, notes:"From uploaded CEB bill", billRef:"452-3718226707-20260429090957", createdAt:"" },
  { id:"d2", meter:1, month:"2026-03", prevReading:13420, currReading:16514, units:3094, totalRs:115430.00, notes:"", billRef:"", createdAt:"" },
  { id:"d3", meter:1, month:"2026-02", prevReading:10510, currReading:13420, units:2910, totalRs:108200.00, notes:"", billRef:"", createdAt:"" },
  { id:"d4", meter:2, month:"2026-04", prevReading:8200,  currReading:9120,  units:920,  totalRs:34800.00,  notes:"", billRef:"", createdAt:"" },
  { id:"d5", meter:2, month:"2026-03", prevReading:7340,  currReading:8200,  units:860,  totalRs:32450.00,  notes:"", billRef:"", createdAt:"" },
  { id:"d6", meter:3, month:"2026-04", prevReading:4120,  currReading:4690,  units:570,  totalRs:21800.00,  notes:"", billRef:"", createdAt:"" },
];

let bills = [];
let chart = null;
const statusEl = document.getElementById("status");
const isDemo = !SCRIPT_URL;

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || "";
}

// ===== Meter ⇄ account mapping (localStorage) =================
function loadMeterMap() {
  try { return JSON.parse(localStorage.getItem(METER_MAP_KEY) || "{}"); }
  catch(e) { return {}; }
}
function saveMeterMap(map) {
  localStorage.setItem(METER_MAP_KEY, JSON.stringify(map));
}
function meterForAccount(acct) {
  const map = loadMeterMap();
  for (const m of [1,2,3]) if (map[m] === acct) return m;
  return null;
}
function setMeterAccount(meter, acct) {
  const map = loadMeterMap();
  map[meter] = acct;
  saveMeterMap(map);
}

// ===== API ===================================================
async function apiList() {
  if (isDemo) {
    try {
      const raw = localStorage.getItem(DEMO_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    localStorage.setItem(DEMO_KEY, JSON.stringify(DEMO_SEED));
    return DEMO_SEED.slice();
  }
  const res = await fetch(SCRIPT_URL, { method: "GET" });
  const json = await res.json();
  if (json.status !== "ok") throw new Error(json.message || "Failed to load");
  return (json.data || []).map(normalizeRow);
}
async function apiAdd(entry) {
  if (isDemo) {
    const list = await apiList();
    // Client-side dedup in demo mode
    if (entry.billRef && list.some(b => b.billRef === entry.billRef)) {
      throw new Error("This bill is already saved (matching Bill Ref).");
    }
    if (list.some(b => b.meter === entry.meter && b.month === entry.month)) {
      throw new Error("A bill already exists for this meter and month.");
    }
    entry.id = "d" + Date.now();
    entry.createdAt = new Date().toISOString();
    list.push(entry);
    localStorage.setItem(DEMO_KEY, JSON.stringify(list));
    return entry;
  }
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "add", ...entry })
  });
  const json = await res.json();
  if (json.status === "duplicate") throw new Error(json.message);
  if (json.status !== "ok") throw new Error(json.message || "Failed to save");
  entry.id = json.id;
  return entry;
}
async function apiDelete(id) {
  if (isDemo) {
    const list = (await apiList()).filter(b => b.id !== id);
    localStorage.setItem(DEMO_KEY, JSON.stringify(list));
    return;
  }
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", id })
  });
  const json = await res.json();
  if (json.status !== "ok") throw new Error(json.message || "Failed to delete");
}

function normalizeRow(r) {
  return {
    id: String(r.ID || r.id || ""),
    meter: Number(r.Meter || r.meter),
    month: formatMonth(r.Month || r.month),
    prevReading: Number(r.PrevReading || r.prevReading) || 0,
    currReading: Number(r.CurrReading || r.currReading) || 0,
    units: Number(r.Units || r.units) || 0,
    totalRs: Number(r.TotalRs || r.totalRs) || 0,
    notes: String(r.Notes || r.notes || ""),
    billRef: String(r.BillRef || r.billRef || ""),
    createdAt: String(r.CreatedAt || r.createdAt || "")
  };
}
function formatMonth(v) {
  if (!v) return "";
  if (typeof v === "string" && /^\d{4}-\d{2}/.test(v)) return v.slice(0, 7);
  const d = new Date(v);
  if (!isNaN(d)) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    return `${y}-${m}`;
  }
  return String(v);
}

// ===== Rendering =============================================
function fmtRs(n) { return isFinite(n) ? "Rs. " + n.toLocaleString("en-LK", { maximumFractionDigits: 2 }) : "—"; }
function fmtNum(n) { return isFinite(n) ? n.toLocaleString("en-LK") : "—"; }
function monthLabel(m) {
  if (!m) return "";
  const [y, mm] = m.split("-");
  return new Date(Number(y), Number(mm) - 1, 1).toLocaleString(undefined, { month: "short", year: "numeric" });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderSummary() {
  const root = document.getElementById("summary");
  root.innerHTML = "";
  [1, 2, 3].forEach(meter => {
    const list = bills.filter(b => b.meter === meter).sort((a, b) => a.month.localeCompare(b.month));
    const latest = list[list.length - 1];
    const prev = list[list.length - 2];
    const div = document.createElement("div");
    div.className = "meter-card";
    let changeHtml = "";
    if (latest && prev && prev.units) {
      const pct = ((latest.units - prev.units) / prev.units) * 100;
      const cls = pct >= 0 ? "up" : "down";
      const arrow = pct >= 0 ? "▲" : "▼";
      changeHtml = `<div class="change ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs ${monthLabel(prev.month)}</div>`;
    }
    div.innerHTML = `
      <div class="meter-name">
        <span class="dot" style="background:var(--m${meter})"></span>
        Meter ${meter}
      </div>
      ${latest ? `
        <div class="stats">
          <div>
            <div class="big">${fmtNum(latest.units)} <span class="small">kWh</span></div>
            <div class="small">${monthLabel(latest.month)}</div>
          </div>
          <div style="text-align:right"><div style="font-weight:600">${fmtRs(latest.totalRs)}</div></div>
        </div>
        ${changeHtml}
      ` : `<div class="small">No data yet</div>`}
    `;
    root.appendChild(div);
  });
}

function renderTable() {
  const filter = document.getElementById("table-meter").value;
  const root = document.getElementById("table-wrap");
  let rows = bills.slice();
  if (filter !== "all") rows = rows.filter(b => b.meter === Number(filter));
  rows.sort((a, b) => b.month.localeCompare(a.month) || a.meter - b.meter);
  if (rows.length === 0) {
    root.innerHTML = `<div class="empty">No bills yet. Drop a PDF above, or fill the form.</div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>Month</th><th>Meter</th>
    <th class="num">Prev kWh</th><th class="num">Curr kWh</th>
    <th class="num">Units</th><th class="num">Total Rs.</th>
    <th>Notes</th><th></th></tr></thead><tbody>`;
  rows.forEach(b => {
    html += `<tr>
      <td>${monthLabel(b.month)}</td>
      <td><span class="meter-pill pill-${b.meter}">M${b.meter}</span></td>
      <td class="num">${fmtNum(b.prevReading)}</td>
      <td class="num">${fmtNum(b.currReading)}</td>
      <td class="num"><strong>${fmtNum(b.units)}</strong></td>
      <td class="num">${fmtRs(b.totalRs)}</td>
      <td>${escapeHtml(b.notes || "")}${b.billRef ? `<div style="font-size:11px;color:var(--muted)" title="Bill Ref">${escapeHtml(b.billRef)}</div>`:""}</td>
      <td><button class="danger" data-del="${b.id}">Delete</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  root.innerHTML = html;
  root.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this bill entry?")) return;
      try {
        setStatus("Deleting…");
        await apiDelete(btn.dataset.del);
        bills = bills.filter(b => b.id !== btn.dataset.del);
        renderAll();
        setStatus("Deleted", "ok");
      } catch (e) { setStatus(e.message, "error"); }
    });
  });
}

function renderChart() {
  const meterFilter = document.getElementById("chart-meter").value;
  const metric = document.getElementById("chart-metric").value;
  const allMonths = Array.from(new Set(bills.map(b => b.month))).sort();
  const datasets = [];
  const meters = meterFilter === "all" ? [1, 2, 3] : [Number(meterFilter)];
  const colors = { 1: "#2563eb", 2: "#059669", 3: "#d97706" };
  meters.forEach(m => {
    const byMonth = {};
    bills.filter(b => b.meter === m).forEach(b => {
      byMonth[b.month] = metric === "cost" ? b.totalRs : b.units;
    });
    datasets.push({
      label: `Meter ${m}`,
      data: allMonths.map(mn => byMonth[mn] ?? null),
      borderColor: colors[m],
      backgroundColor: colors[m] + "33",
      tension: 0.25, spanGaps: true, pointRadius: 4
    });
  });
  const ctx = document.getElementById("chart").getContext("2d");
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: { labels: allMonths.map(monthLabel), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom" },
        tooltip: {
          callbacks: {
            label: c => `${c.dataset.label}: ${metric === "cost" ? fmtRs(c.parsed.y) : fmtNum(c.parsed.y) + " kWh"}`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: v => metric === "cost" ? "Rs. " + v.toLocaleString() : v.toLocaleString() }
        }
      }
    }
  });
}

function renderAll() { renderSummary(); renderTable(); renderChart(); }

// ===== Form =================================================
const form = document.getElementById("add-form");
const prevInput = form.prevReading;
const currInput = form.currReading;
const unitsInput = form.units;

function recalcUnits() {
  const p = parseFloat(prevInput.value);
  const c = parseFloat(currInput.value);
  unitsInput.value = (isFinite(p) && isFinite(c) && c >= p) ? (c - p).toLocaleString() : "";
}
prevInput.addEventListener("input", recalcUnits);
currInput.addEventListener("input", recalcUnits);

function clearExtractedMsg() { document.getElementById("extracted-msg").innerHTML = ""; }
function showExtractedMsg(html, kind) {
  const el = document.getElementById("extracted-msg");
  el.innerHTML = `<div class="extracted ${kind||''}">${html}</div>`;
}
function clearForm() {
  form.reset();
  form.billRef.value = "";
  unitsInput.value = "";
  clearExtractedMsg();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const prev = parseFloat(fd.get("prevReading"));
  const curr = parseFloat(fd.get("currReading"));
  if (!(curr >= prev)) { alert("Current reading should be ≥ previous reading."); return; }
  const entry = {
    meter: Number(fd.get("meter")),
    month: String(fd.get("month")),
    prevReading: prev,
    currReading: curr,
    units: curr - prev,
    totalRs: parseFloat(fd.get("totalRs")),
    notes: String(fd.get("notes") || ""),
    billRef: String(fd.get("billRef") || "")
  };
  try {
    setStatus("Saving…");
    const saved = await apiAdd(entry);
    bills.push(normalizeRow({
      ID: saved.id, Meter: saved.meter, Month: saved.month,
      PrevReading: saved.prevReading, CurrReading: saved.currReading,
      Units: saved.units, TotalRs: saved.totalRs, Notes: saved.notes,
      BillRef: saved.billRef, CreatedAt: saved.createdAt
    }));
    renderAll();
    clearForm();
    setStatus("Saved", "ok");
  } catch (err) { setStatus(err.message, "error"); alert(err.message); }
});

  form.currReading.value = "19768";
  form.totalRs.value = "121565.13";
  form.notes.value = "From uploaded CEB bill";
  form.billRef.value = "452-3718226707-20260429090957";

// ===== PDF parsing ==========================================
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let all = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    all += tc.items.map(it => it.str).join(" ") + "\n";
  }
  return all;
}

function parseBillText(text) {
  const out = { warnings: [] };

  const refMatch = text.match(/Bill\s*Ref:?\s*([0-9A-Za-z\-]+)/i);
  if (refMatch) out.billRef = refMatch[1];

  const acctMatch = text.match(/Electricity\s*A\s*\/?\s*C\s*No\.?:?\s*(\d+)/i);
  if (acctMatch) out.accountNo = acctMatch[1];

  // Month — handles BOTH orderings ("Month: 2026 APR" and "2026 APR Month:")
  const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let monthMatch = text.match(/Month\s*:?\s*(\d{4})\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)/i);
  if (!monthMatch) monthMatch = text.match(/(\d{4})\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\s+Month\s*:/i);
  if (monthMatch) {
    const idx = monthNames.indexOf(monthMatch[2].toUpperCase().slice(0,3));
    if (idx >= 0) out.month = `${monthMatch[1]}-${String(idx+1).padStart(2,'0')}`;
  }

  const billDateMatch = text.match(/Bill\s*Date:?\s*(\d{2})\/(\d{2})\/(\d{4})/);
  if (billDateMatch) out.billDate = `${billDateMatch[3]}-${billDateMatch[1]}-${billDateMatch[2]}`;

  // Units — try paired form first; require the number is NOT followed by ",NNN" or ".NN"
  // (so it can't be a fragment of a currency value like 94 inside "94,386.00").
  let um = text.match(/No\.?\s*of\s*Units\s*Consumed\s*\(?kWh\)?\s+(\d{1,7})(?![,.\d])/i);
  if (!um) um = text.match(/No\.?\s*of\s*Units\s*Consumed\s*\(?kWh\)?[\s\S]{0,200}?(\d{1,7})(?![,.\d])/i);
  if (um) out.units = parseInt(um[1], 10);

  // Total Rs — try multiple strategies, in order; the first that finds a value wins.
  // Strategy A: the first decimal value within 80 chars after the account number
  //   (CEB stream layout: ...Electricity A/C No.: XXX  <THIS-MONTH-CHARGE>  ...).
  let tm = text.match(/Electricity\s*A\s*\/?\s*C\s*No\.?:?\s*\d+[\s\S]{0,80}?([\d,]+\.\d{2})/i);
  let totalVia = 'A';
  // Strategy B: value near "Total with Tax (Rs.)" label
  if (!tm) { tm = text.match(/Total\s*with\s*Tax\s*\(?\s*Rs\.?\s*\)?[\s\S]{0,500}?([\d,]+\.\d{2})/i); totalVia = 'B'; }
  // Strategy C: "+ value (Including Taxes)" formula pattern
  if (!tm) { tm = text.match(/\+\s*([\d,]+\.\d{2})\s*\(Including\s*Taxes\)/i); totalVia = 'C'; }
  // Strategy D: "This Month Charge" label
  if (!tm) { tm = text.match(/This\s*Month\s*Charge[\s\S]{0,300}?([\d,]+\.\d{2})/i); totalVia = 'D'; }
  if (tm) {
    out.totalRs = parseFloat(tm[1].replace(/,/g,''));
    out._totalVia = totalVia;
  }

  // Readings — find any pair of 4-7 digit nums (not just consecutive) where the
  // difference equals the units we extracted. Years (1900-2100) are excluded.
  const nums = [];
  const numRe = /\b\d{4,7}\b/g;
  let mm;
  while ((mm = numRe.exec(text)) !== null) {
    const n = parseInt(mm[0], 10);
    if (n >= 1900 && n <= 2100) continue; // skip year-like values
    nums.push(n);
  }
  let found = null;
  if (out.units) {
    for (const a of nums) {
      for (const b of nums) {
        if (a !== b && a > b && a - b === out.units) { found = { curr:a, prev:b }; break; }
      }
      if (found) break;
    }
  }
  // Fallback: consecutive pair whose diff also appears in the list (when no units known)
  if (!found) {
    const set = new Set(nums);
    for (let i = 0; i < nums.length - 1; i++) {
      const a = nums[i], b = nums[i+1];
      if (a > b && set.has(a - b) && (a - b) >= 50 && (a - b) <= 100000) {
        found = { curr:a, prev:b }; break;
      }
    }
  }
  if (found) {
    out.currReading = found.curr;
    out.prevReading = found.prev;
    if (!out.units) out.units = found.curr - found.prev;
  } else {
    out.warnings.push("Couldn't auto-detect meter readings — please enter manually.");
  }
  return out;
}

async function handlePdf(file) {
  if (!file || file.type !== "application/pdf") {
    showExtractedMsg("Please drop a PDF file.", "err"); return;
  }
  if (!window.pdfjsLib) {
    showExtractedMsg("PDF reader didn't load. Check your internet connection.", "err"); return;
  }
  setStatus("Reading PDF…", "warn");
  try {
    const text = await extractPdfText(file);
    const parsed = parseBillText(text);

    if (!parsed.billRef) {
      showExtractedMsg("Couldn't read Bill Ref from this PDF. Make sure it's an original CEB e-bill.", "err");
      setStatus(isDemo ? "Demo mode" : "Connected", isDemo ? "" : "ok"); return;
    }

    // Dedup check (client side)
    if (bills.some(b => b.billRef === parsed.billRef)) {
      showExtractedMsg(`<strong>Already saved.</strong> A bill with reference <code>${escapeHtml(parsed.billRef)}</code> is already in your records.`, "dup");
      setStatus("Already saved", "warn"); return;
    }

    // Determine meter from account number
    let meter = parsed.accountNo ? meterForAccount(parsed.accountNo) : null;
    if (!meter && parsed.accountNo) {
      const ans = prompt(`First time seeing account number ${parsed.accountNo}.\nWhich meter is this? Enter 1, 2, or 3:`);
      const n = Number(ans);
      if (n === 1 || n === 2 || n === 3) {
        setMeterAccount(n, parsed.accountNo);
        meter = n;
      }
    }

    // Fill the form
    if (meter) form.meter.value = String(meter);
    if (parsed.month) form.month.value = parsed.month;
    if (parsed.prevReading != null) form.prevReading.value = parsed.prevReading;
    if (parsed.currReading != null) form.currReading.value = parsed.currReading;
    if (parsed.totalRs != null) form.totalRs.value = parsed.totalRs;
    if (parsed.billRef) form.billRef.value = parsed.billRef;
    if (!form.notes.value && parsed.billDate) form.notes.value = `Bill date ${parsed.billDate}`;
    recalcUnits();

    const chips = [];
    if (meter) chips.push(`Meter <strong>${meter}</strong>`); else chips.push(`<span style="color:var(--warn)">Meter not set</span>`);
    if (parsed.month) chips.push(monthLabel(parsed.month));
    if (parsed.units != null) chips.push(`${fmtNum(parsed.units)} kWh`);
    if (parsed.totalRs != null) chips.push(fmtRs(parsed.totalRs));
    if (parsed.prevReading != null && parsed.currReading != null)
      chips.push(`${fmtNum(parsed.prevReading)} → ${fmtNum(parsed.currReading)}`);

    const warnHtml = parsed.warnings.length
      ? `<div style="margin-top:6px;color:var(--warn)">⚠ ${parsed.warnings.map(escapeHtml).join("; ")}</div>` : "";
    showExtractedMsg(
      `<strong>Extracted from PDF:</strong> ${chips.map(c=>`<span class="chip">${c}</span>`).join("")}<br>
       <span style="font-size:12px">Review and click <strong>Save bill</strong>.</span>${warnHtml}`
    );
    setStatus("PDF parsed", "ok");
  } catch (err) {
    console.error(err);
    showExtractedMsg("Couldn't read this PDF: " + escapeHtml(err.message), "err");
    setStatus("PDF error", "error");
  }
}

const dz = document.getElementById("dropzone");
const pdfInput = document.getElementById("pdf-input");
pdfInput.addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) handlePdf(f);
  pdfInput.value = "";
});
["dragenter","dragover"].forEach(ev =>
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev =>
  dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("dragging"); }));
dz.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) handlePdf(f);
});

const modal = document.getElementById("settings-modal");
document.getElementById("open-settings").addEventListener("click", () => {
  const map = loadMeterMap();
  document.getElementById("acct-1").value = map[1] || "";
  document.getElementById("acct-2").value = map[2] || "";
  document.getElementById("acct-3").value = map[3] || "";

});
document.getElementById("settings-cancel").addEventListener("click", () => modal.classList.remove("open"));
modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });
document.getElementById("settings-save").addEventListener("click", () => {
  const map = {};
  ["1","2","3"].forEach(n => {
    const v = document.getElementById("acct-"+n).value.trim();
    if (v) map[n] = v;
  });
  saveMeterMap(map);
  modal.classList.remove("open");
  setStatus("Settings saved", "ok");
});

// ===== Boot =================================================
(async function init() {
  try {
    setStatus(isDemo ? "Demo mode (browser storage)" : "Loading…");
    bills = (await apiList()).map(normalizeRow);
    renderAll();
    if (!isDemo) setStatus("Connected", "ok");
    // Seed meter mapping from the sample bill so demo mode works smoothly
    if (isDemo && !loadMeterMap()["1"]) setMeterAccount(1, "3718226707");
  } catch (err) {
    setStatus(err.message, "error");
  }
})();
